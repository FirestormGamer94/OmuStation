# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  name: PLACEHOLDER_NAME
  parent: [BaseItem, BaseCentcommContraband]
  id: CentCommJustice
  description: PLACEHOLDER_DESCRIPTION
  components:
  - type: Item
    sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
    size: Ginormous # Use your sheath.
    heldPrefix: off
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
    state: icon
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 50
    autoRechargePauseTime: 40
  - type: DisarmMalus
  - type: Tag
    tags:
    - Justice
    - HighRiskItem
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 60
    animation: WeaponArcThrust
  - type: ItemSwitch
    needsPower: true
    defaultState: off
    state: "off"
    showLabel: true
    states:
      off: !type:ItemSwitchState
        verb: off
        energyPerUse: 0
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 12
            woundSeverityMultipliers:
              Slash: 2
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
          angle: 60
          animation: WeaponArcThrust

      stun: !type:ItemSwitchState
        verb: stun
        energyPerUse: 48
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: stun-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Shock: 0
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        - type: StaminaDamageOnHit
          damage: 20
          overtime: 15
          lightAttackDamageMultiplier: 2
          lightAttackOvertimeDamageMultiplier: 1
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      ion: !type:ItemSwitchState
        verb: ion
        energyPerUse: 65 # 65 real
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: ion-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Ion: 24
              Shock: 3
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      phoron: !type:ItemSwitchState
        verb: phoron
        energyPerUse: 80
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: phoron-icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1
          damage:
            types:
              Slash: 30
              Heat: 35
              Radiation: 10
              Structural: 80
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/Weapons/eblade1.ogg
        - type: PointLight
          enabled: true
          radius: 3
          energy: 2
          color: "#ffffff"
        - type: Reflect
          reflectProb: 0.75
          reflects:
            - Energy
        soundStateActivate:
          path: /Audio/_Goobstation/Weapons/Effects/nanotrasenenergyon.ogg
          params:
            variation: 0.250

      empowered: !type:ItemSwitchState
        verb: empowered
        energyPerUse: 100
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: empowered-icon
        components:
        - type: Explosive
          explosionType: Default
          totalIntensity: 16
          intensitySlope: 0.5
          maxIntensity: 1.6
          canCreateVacuum: false
          deleteAfterExplosion: false
          repeatable: true
        - type: ExplodeOnMeleeHit
        - type: MeleeWeapon
          canWideSwing: false
          attackRate: 0.5
          animation: WeaponArcThrust
          damage:
            types:
              Slash: 25
              Heat: 25
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250